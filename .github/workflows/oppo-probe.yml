name: OPPO CPH2841 Emulator Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install system image (runner image already ships the Android SDK)
        run: |
          SDK_BIN=""
          for d in "$ANDROID_HOME"/cmdline-tools/latest/bin "$ANDROID_HOME"/cmdline-tools/*/bin; do
            if [ -x "$d/sdkmanager" ]; then SDK_BIN="$d"; break; fi
          done
          echo "Using cmdline-tools at: $SDK_BIN"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export PATH="$SDK_BIN:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Create AVD and launch emulator with CPH2841 launch props
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n probe -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --path "$ANDROID_AVD_HOME/probe.avd"
          echo "disk.dataPartition.size=8G" >> "$ANDROID_AVD_HOME/probe.avd/config.ini"
          echo "--- AVDs the emulator can see:"
          emulator -list-avds
          echo "--- AVD directory contents:"
          ls -la "$ANDROID_AVD_HOME"
          nohup emulator -avd probe -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -writable-system \
            -prop ro.product.model=CPH2841 \
            -prop ro.product.device=OP627CL1 \
            -prop ro.product.name=CPH2841EEA \
            -prop ro.product.manufacturer=OPPO \
            -prop ro.product.brand=OPPO \
            -prop "ro.build.fingerprint=OPPO/CPH2841EEA/OP627CL1:16/BP2A.250605.015/B.R4T2.aef3b8_1a19661_1a14cbd:user/release-keys" \
            > emulator-launch.log 2>&1 &
          echo "--- waiting up to 5 minutes for the emulator to register with adb"
          ok=""
          for i in $(seq 1 60); do
            if adb devices | grep -q "^emulator-.*device$"; then ok=1; break; fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "EMULATOR_NEVER_REGISTERED - emulator launch log follows:"
            cat emulator-launch.log || true
            exit 1
          fi
          adb wait-for-device

      - name: Run probe against the emulator
        run: bash probe.sh

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cph2841-probe-results
          path: probe-results

      - name: Upload emulator launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-launch-log
          path: emulator-launch.log
